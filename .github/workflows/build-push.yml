name: Build and Push Database Schema Image

on:
  push:
    branches: [ main ]
    paths:
      - 'migrations/**'
      - 'src/**'
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'diesel.toml'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nwagbara-group-llc/databaseschema
  NAMESPACE: databaseschema

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # GitHub-hosted runner - no special access needed
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      run: |
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        echo "version=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$SHORT_SHA,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Summary
      run: |
        echo "=========================================="
        echo "Image Built Successfully"
        echo "=========================================="
        echo "Registry: ${{ env.REGISTRY }}"
        echo "Image: ${{ env.IMAGE_NAME }}"
        echo "Tags: ${{ steps.meta.outputs.version }}, latest"
        echo "=========================================="

  run-migrations:
    needs: build-and-push
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: read
    
    steps:
    - name: Fetch Secrets from Azure Key Vault
      id: secrets
      env:
        AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
      run: |
        echo "Fetching secrets from Azure Key Vault..."
        
        # Parse Azure credentials
        CLIENT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientId')
        CLIENT_SECRET=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientSecret')
        TENANT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.tenantId')
        
        if [ -z "$CLIENT_ID" ] || [ "$CLIENT_ID" = "null" ]; then
          echo "::error::AZURE_CREDENTIALS secret is empty or malformed"
          exit 1
        fi
        echo "[OK] Azure credentials parsed successfully"
        
        # Authenticate with Azure CLI
        az login --service-principal \
          --username "$CLIENT_ID" \
          --password "$CLIENT_SECRET" \
          --tenant "$TENANT_ID" \
          --output none
        echo "[OK] Successfully authenticated with Azure"
        
        # Fetch database secrets
        declare -A SECRETS
        for SECRET_NAME in POSTGRES-HOST POSTGRES-PORT POSTGRES-USER POSTGRES-PASSWORD POSTGRES-DB; do
          ENV_NAME=$(echo "$SECRET_NAME" | tr '-' '_')
          VALUE=$(az keyvault secret show --vault-name "$AZURE_KEYVAULT_NAME" --name "$SECRET_NAME" --query value -o tsv)
          
          if [ -z "$VALUE" ]; then
            echo "::error::Failed to fetch secret $SECRET_NAME"
            exit 1
          fi
          
          SECRETS[$ENV_NAME]="$VALUE"
          echo "::add-mask::$VALUE"
          echo "$ENV_NAME=$VALUE" >> "$GITHUB_ENV"
          echo "[OK] Fetched secret $ENV_NAME"
        done
        
        # Construct DATABASE_URL from already-fetched values
        DATABASE_URL="postgresql://${SECRETS[POSTGRES_USER]}:${SECRETS[POSTGRES_PASSWORD]}@${SECRETS[POSTGRES_HOST]}:${SECRETS[POSTGRES_PORT]}/${SECRETS[POSTGRES_DB]}"
        echo "::add-mask::$DATABASE_URL"
        echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
        echo "[OK] DATABASE_URL constructed"

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Migrations
      run: |
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}
        docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}

    - name: Migration Summary
      run: |
        echo "=========================================="
        echo "Migrations Completed Successfully"
        echo "=========================================="
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}"
        echo "=========================================="

