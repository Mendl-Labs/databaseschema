name: Build and Push Database Schema Image

on:
  push:
    branches: [ main ]
    paths:
      - 'migrations/**'
      - 'src/**'
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'diesel.toml'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nwagbara-group-llc/databaseschema
  NAMESPACE: databaseschema

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # GitHub-hosted runner - no special access needed
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      run: |
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        echo "version=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$SHORT_SHA,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Summary
      run: |
        echo "=========================================="
        echo "Image Built Successfully"
        echo "=========================================="
        echo "Registry: ${{ env.REGISTRY }}"
        echo "Image: ${{ env.IMAGE_NAME }}"
        echo "Tags: ${{ steps.meta.outputs.version }}, latest"
        echo "=========================================="

  run-migrations:
    needs: build-and-push
    runs-on: [self-hosted, windows, x64]
    
    steps:
    - name: Fetch Secrets from Azure Key Vault
      id: secrets
      shell: powershell
      env:
        AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
      run: |
        Write-Host "Fetching secrets from Azure Key Vault..."
        
        # Parse Azure credentials
        try {
          if ([string]::IsNullOrWhiteSpace($env:AZURE_CREDENTIALS)) {
            throw "AZURE_CREDENTIALS secret is empty or not set"
          }
          $creds = $env:AZURE_CREDENTIALS | ConvertFrom-Json -ErrorAction Stop
          Write-Host "[OK] Azure credentials parsed successfully"
        } catch {
          Write-Error "Failed to parse Azure credentials: $_"
          exit 1
        }
        
        # Authenticate with Azure CLI
        try {
          Write-Host "[INFO] Attempting Azure CLI login..."
          $loginResult = az login --service-principal `
            --username $creds.clientId `
            --password $creds.clientSecret `
            --tenant $creds.tenantId `
            --output json 2>&1
          
          if ($LASTEXITCODE -ne 0) {
            throw "Azure CLI login failed"
          }
          Write-Host "[OK] Successfully authenticated with Azure"
        } catch {
          Write-Error "Azure authentication failed: $_"
          exit 1
        }
        
        # Fetch database secrets
        $secretNames = @("POSTGRES-HOST", "POSTGRES-PORT", "POSTGRES-USER", "POSTGRES-PASSWORD", "POSTGRES-DB")
        
        foreach ($secretName in $secretNames) {
          $envName = $secretName -replace "-", "_"
          $value = az keyvault secret show --vault-name $env:AZURE_KEYVAULT_NAME --name $secretName --query value -o tsv 2>&1
          
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($value)) {
            Write-Error "[FAIL] Failed to fetch secret $secretName"
            exit 1
          }
          
          $cleanValue = $value.Trim()
          Write-Host "::add-mask::$cleanValue"
          Add-Content -Path $env:GITHUB_ENV -Value "$envName=$cleanValue"
          Write-Host "[OK] Fetched secret $envName"
        }
        
        # Construct DATABASE_URL
        $databaseUrl = "postgresql://$($env:POSTGRES_USER):$($env:POSTGRES_PASSWORD)@$($env:POSTGRES_HOST):$($env:POSTGRES_PORT)/$($env:POSTGRES_DB)"
        Write-Host "::add-mask::$databaseUrl"
        Add-Content -Path $env:GITHUB_ENV -Value "DATABASE_URL=$databaseUrl"
        Write-Host "[OK] DATABASE_URL constructed"

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Migrations
      shell: powershell
      run: |
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}
        docker run --rm --network host -e DATABASE_URL="$env:DATABASE_URL" ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}

    - name: Migration Summary
      shell: powershell
      run: |
        Write-Host "=========================================="
        Write-Host "Migrations Completed Successfully"
        Write-Host "=========================================="
        Write-Host "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}"
        Write-Host "=========================================="

