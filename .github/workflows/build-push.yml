name: Build, Push and Run Database Migrations

on:
  push:
    branches: [ main ]
    paths:
      - 'migrations/**'
      - 'src/**'
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'diesel.toml'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run database migrations after build'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nwagbara-group-llc/databaseschema
  NAMESPACE: databaseschema

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # GitHub-hosted runner - no special access needed
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      run: |
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        echo "version=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$SHORT_SHA,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Summary
      run: |
        echo "=========================================="
        echo "Image Built Successfully"
        echo "=========================================="
        echo "Registry: ${{ env.REGISTRY }}"
        echo "Image: ${{ env.IMAGE_NAME }}"
        echo "Tags: ${{ steps.meta.outputs.version }}, latest"
        echo "=========================================="

  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.inputs.run_migrations != 'false'
    timeout-minutes: 15
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Migrations
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
        
        echo "Running migrations with image: ${IMAGE}"
        
        docker pull "${IMAGE}"
        docker run --rm \
          -e DATABASE_URL="${DATABASE_URL}" \
          "${IMAGE}" \
          diesel migration run
        
        echo "[OK] Migrations completed successfully!"

    - name: Migration Summary
      run: |
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        echo "=========================================="
        echo "Migration Summary"
        echo "=========================================="
        echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
        echo "Status: Completed"
        echo "=========================================="
