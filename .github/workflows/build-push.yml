name: Build, Push and Run Database Migrations

on:
  push:
    branches: [ main ]
    paths:
      - 'migrations/**'
      - 'src/**'
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'diesel.toml'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run database migrations after build'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nwagbara-group-llc/databaseschema
  NAMESPACE: databaseschema

jobs:
  build-and-push:
    runs-on: [self-hosted, windows, x64]
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      shell: powershell
      run: |
        $shortSha = "${{ github.sha }}".Substring(0, 7)
        echo "version=$shortSha" >> $env:GITHUB_OUTPUT
        echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$shortSha,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $env:GITHUB_OUTPUT

    - name: Build and push
      shell: powershell
      run: |
        $shortSha = "${{ github.sha }}".Substring(0, 7)
        Write-Host "Building Docker image with tag: $shortSha"
        
        docker build `
          --platform linux/amd64 `
          --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$shortSha `
          --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest `
          --file ./Dockerfile `
          --progress=plain `
          .
        
        if ($LASTEXITCODE -ne 0) {
          throw "Docker build failed"
        }
        
        Write-Host "Pushing images..."
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$shortSha
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        
        Write-Host "[OK] Images pushed successfully"

    - name: Summary
      shell: powershell
      run: |
        $shortSha = "${{ github.sha }}".Substring(0, 7)
        Write-Host "=========================================="
        Write-Host "Image Built Successfully"
        Write-Host "=========================================="
        Write-Host "Registry: ${{ env.REGISTRY }}"
        Write-Host "Image: ${{ env.IMAGE_NAME }}"
        Write-Host "Tags: $shortSha, latest"
        Write-Host "=========================================="

  run-migrations:
    name: Run Database Migrations
    runs-on: [self-hosted, windows, x64]
    needs: build-and-push
    if: github.event.inputs.run_migrations != 'false'
    timeout-minutes: 15
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check Kubernetes Connection
      shell: powershell
      run: |
        Write-Host "Verifying Kubernetes connection..."
        kubectl cluster-info
        kubectl get nodes
        Write-Host "[OK] Kubernetes connection verified"

    - name: Fetch Secrets from Azure Key Vault
      shell: powershell
      env:
        AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
      run: |
        Write-Host "Fetching secrets from Azure Key Vault..."
        
        try {
          if ([string]::IsNullOrWhiteSpace($env:AZURE_CREDENTIALS)) {
            throw "AZURE_CREDENTIALS secret is empty or not set"
          }
          
          $creds = $env:AZURE_CREDENTIALS | ConvertFrom-Json -ErrorAction Stop
          
          if (-not $creds.clientId -or -not $creds.clientSecret -or -not $creds.tenantId) {
            throw "Invalid Azure credentials format"
          }
          
          Write-Host "[OK] Azure credentials parsed successfully"
        } catch {
          Write-Error "Failed to parse Azure credentials: $($_.Exception.Message)"
          exit 1
        }
        
        # Authenticate with Azure CLI
        try {
          Write-Host "[INFO] Authenticating with Azure..."
          az login --service-principal `
            --username $creds.clientId `
            --password $creds.clientSecret `
            --tenant $creds.tenantId `
            --output json 2>&1 | Out-Null
          
          if ($LASTEXITCODE -ne 0) {
            throw "Azure CLI login failed"
          }
          
          Write-Host "[OK] Successfully authenticated with Azure"
        } catch {
          Write-Error "Azure authentication failed: $_"
          exit 1
        }
        
        # Fetch database secrets
        $secretNames = @("POSTGRES-HOST","POSTGRES-PORT","POSTGRES-USER","POSTGRES-PASSWORD","POSTGRES-DB")
        
        foreach ($secretName in $secretNames) {
          try {
            $envName = $secretName -replace "-", "_"
            $value = az keyvault secret show --vault-name $env:AZURE_KEYVAULT_NAME --name $secretName --query value -o tsv 2>&1
            
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($value)) {
              Write-Error "[FAIL] Failed to fetch secret $secretName"
              exit 1
            }
            
            $cleanValue = $value.Trim()
            echo "${envName}=${cleanValue}" >> $env:GITHUB_ENV
            Write-Host "[OK] Fetched $secretName"
          } catch {
            Write-Error "[FAIL] Error fetching $secretName : $_"
            exit 1
          }
        }
        
        Write-Host "[OK] All secrets fetched successfully"

    - name: Create Migration Job YAML
      shell: powershell
      run: |
        $shortSha = "${{ github.sha }}".Substring(0, 7)
        $databaseUrl = "postgresql://$($env:POSTGRES_USER):$($env:POSTGRES_PASSWORD)@$($env:POSTGRES_HOST):$($env:POSTGRES_PORT)/$($env:POSTGRES_DB)"
        
        $jobYaml = @"
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: database-migration
          namespace: ${{ env.NAMESPACE }}
          labels:
            app.kubernetes.io/name: databaseschema
            app.kubernetes.io/component: migration
        spec:
          ttlSecondsAfterFinished: 300
          backoffLimit: 3
          template:
            spec:
              restartPolicy: Never
              imagePullSecrets:
                - name: ghcr-secret
              containers:
                - name: migration
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$shortSha
                  command: ["diesel", "migration", "run"]
                  env:
                    - name: DATABASE_URL
                      value: "$databaseUrl"
                  resources:
                    requests:
                      memory: "128Mi"
                      cpu: "100m"
                    limits:
                      memory: "256Mi"
                      cpu: "500m"
        "@
        
        # Remove leading whitespace from each line
        $jobYaml = ($jobYaml -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
        $jobYaml | Out-File -FilePath "migration-job.yaml" -Encoding utf8
        Write-Host "[OK] Migration job YAML created"

    - name: Run Migrations
      shell: powershell
      run: |
        Write-Host "Running database migrations..."
        
        # Create namespace if it doesn't exist
        kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
        
        # Create image pull secret for GHCR
        kubectl create secret docker-registry ghcr-secret --docker-server=ghcr.io --docker-username=${{ github.actor }} --docker-password=${{ secrets.GITHUB_TOKEN }} --namespace=${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
        
        # Delete any existing migration job
        kubectl delete job database-migration -n ${{ env.NAMESPACE }} --ignore-not-found
        
        # Apply migration job
        kubectl apply -f migration-job.yaml
        
        Write-Host "[INFO] Waiting for migration job to complete..."
        $result = kubectl wait --for=condition=complete job/database-migration -n ${{ env.NAMESPACE }} --timeout=300s 2>&1
        
        if ($LASTEXITCODE -eq 0) {
          Write-Host "[OK] Migrations completed successfully!"
          Write-Host ""
          Write-Host "[INFO] Migration logs:"
          kubectl logs job/database-migration -n ${{ env.NAMESPACE }}
        } else {
          Write-Host "[FAIL] Migration job failed or timed out"
          Write-Host ""
          Write-Host "[DEBUG] Migration logs:"
          kubectl logs job/database-migration -n ${{ env.NAMESPACE }}
          Write-Host ""
          Write-Host "[DEBUG] Job status:"
          kubectl describe job/database-migration -n ${{ env.NAMESPACE }}
          exit 1
        }

    - name: Migration Summary
      shell: powershell
      run: |
        $shortSha = "${{ github.sha }}".Substring(0, 7)
        Write-Host "=========================================="
        Write-Host "Migration Summary"
        Write-Host "=========================================="
        Write-Host "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$shortSha"
        Write-Host "Database: $($env:POSTGRES_DB) @ $($env:POSTGRES_HOST)"
        Write-Host "Status: Completed"
        Write-Host "=========================================="
