[package]
name = "databaseschema"
version = "0.1.0"
edition = "2021"
description = "Open-source core schema for the TradingPlatform: backtest/strategy/portfolio/live-trading tables only. No multi-tenancy, billing, or AI-research tables."
license = "FSL-1.1-ALv2"

[dependencies]
anyhow = "1.0.86"
bigdecimal = { version = "0.4.5", features = ["serde"] }
chrono = { version = "0.4.19", features = ["serde"] }
diesel = { version = "2.2.2", features = ["chrono", "uuid", "numeric", "64-column-tables", "postgres", "serde_json"] }
diesel-async = { version = "0.5.0", features = ["deadpool", "postgres"] }
scoped-futures = "0.1"
futures-util = "0.3.30"
deadpool = "0.12.1"
dotenv = "0.15.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
tokio = { version = "1.38.0", features = ["full"] }
thiserror = "1.0"
uuid = { version = "1.10.0", features = ["serde", "v4"] }
